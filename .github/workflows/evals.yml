name: Evals

# Manual only: each run spends part of a small Free-plan allowance.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled run is still billed once any execution has finished.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Not a secret; the CLI gitignores its project link, so CI has to name the server.
      SERVER_ID: 0b0f4785-4c21-43ff-b73f-01c22dac2ac3
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The action only runs suites, so the repo's files have to reach Cloud first.
      - name: Push eval suites
        run: pnpm exec mcp-use evals push evals/
        env:
          MANUFACT_TOKEN: ${{ secrets.MANUFACT_TOKEN }}
          MANUFACT_SERVER: ${{ env.SERVER_ID }}

      # Pinned to the commit behind the v1 tag so the gate cannot change without a commit here.
      - uses: mcp-use/evals@b686cff9110b56173054255598d5431b978e1e27 # v1
        with:
          token: ${{ secrets.MANUFACT_TOKEN }}
          server: ${{ env.SERVER_ID }}
          suites: evals/
          timeout: "900"
